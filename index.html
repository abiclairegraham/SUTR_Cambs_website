<!-- One place to update the year after includes -->
<script>
  document.addEventListener('includes:loaded', () => {
    const y = document.getElementById('year');
    if (y) y.textContent = new Date().getFullYear();
  });
</script>

<!-- EmailOctopus form -->
<script>
  document.addEventListener('includes:loaded', () => {
    const target = document.getElementById('emailoctopus-form');
    if (!target) return;

    const script = document.createElement('script');

    script.async = true;
    script.src =
      'https://eocampaign1.com/form/c56af212-95dd-11f1-a34b-1dccb761aea7.js';

    script.setAttribute(
      'data-form',
      'c56af212-95dd-11f1-a34b-1dccb761aea7'
    );

    target.appendChild(script);
  });
</script> 
 
<!-- News init: only once, after includes are done -->
<script type="module">
  import { initNews } from "./assets/js/news.js";
  document.addEventListener("includes:loaded", () => {
    initNews();
  });
</script>

<!-- Facebook SDK root (keep this before the SDK script) -->
<div id="fb-root"></div>

<!-- FB SDK (async) -->
<script async defer crossorigin="anonymous"
  src="https://connect.facebook.net/en_GB/sdk.js#xfbml=1&version=v17.0"></script>

<!-- Make sure the config.json data is loaded after the partials -->
<script>
  // FB SDK ready → fire a custom event once
  window.fbAsyncInit = function() {
    FB.init({ xfbml: true, version: 'v17.0' });
    document.dispatchEvent(new Event('fb:ready'));
  };

  document.addEventListener('includes:loaded', async () => {
    // 1) hydrate config first
    if (window.applyConfig) {
      try { await window.applyConfig(); } catch (e) { console.error(e); }
    }

    // 2) now (re)parse the social section
    const social = document.getElementById('social');
    if (!social) return;

    const parseSocial = () => {
      if (window.FB?.XFBML?.parse) FB.XFBML.parse(social);
    };

    if (window.FB?.XFBML?.parse) {
      parseSocial();
    } else {
      document.addEventListener('fb:ready', parseSocial, { once: true });
    }
  });
</script>
